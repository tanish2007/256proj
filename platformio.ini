[platformio]
src_dir = .
include_dir = .

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
lib_ldf_mode = deep
lib_deps = https://github.com/ThingPulse/esp8266-oled-ssd1306/archive/refs/tags/4.6.1.zip
            teckel12/NewPing
; To switch which sketch compiles, just rename the .ino files:
;   only ONE of these four should end in .ino at a time
;   the others should end in .ino.bak (PlatformIO ignores .bak)
;     HardwareCar.ino    — manual-control version with OLED + buttons
;     Q_learning.ino     — Q-learning autonomous version
;     ForwardTest.ino    — straight-line motor sanity test
;     BtControl.ino      — Bluetooth keyboard control (W/A/S/D via phone)
;     WiFiControl.ino    — WiFi browser control (W/A/S/D via laptop browser)
;     ObstacleAvoid.ino  — hardcoded obstacle avoidance with OLED display
